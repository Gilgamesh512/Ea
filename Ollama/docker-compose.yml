services:
  ollama:
    image: ollama/ollama:latest
    container_name: aegisgil
    volumes:
      - ./ollama_data:/root/.ollama  # Đã chuyển vào Aegis_Gil nè Gil!
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always